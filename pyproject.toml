[project]
name = "agent-skills-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "httpx>=0.27",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that require network access (deselect with '-m \"not network\"')",
]
